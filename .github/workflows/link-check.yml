name: link-check

# 这个 job 存在的唯一目的：让「README 里放了不存在的仓」变红。
# 它必须能失败——否则不配被设为必需检查；负对照见「塞一条死链即 405 拒合」的外用探针。
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every GitHub repo link in README resolves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_SLUG: ${{ github.repository }}
        run: python .github/link-check/check_links.py
